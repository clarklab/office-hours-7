# OFFICE HOURS VII — deploy config.
#
# A zero-build static site: the repo root IS the site. No bundler runs, nothing is
# minified, and there are no redirects — `/watch.html?ep=ep1` must reach watch.html
# with its query string intact.

[build]
  publish = "."
  command = ""

# Netlify's post-processing would otherwise be free to rewrite the hand-written GLSL
# in the PS1 shader and the ES modules. Leave every byte alone.
[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

# ------------------------------------------------------------------ security

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # Everything is first-party and procedural, so this can be tight. The one inline
    # script on each page is the import map; its sha256 is pinned below. Keep that hash
    # in step with the <script type="importmap"> block in index.html and watch.html —
    # it is the sha256 of exactly {"imports":{"three":"/vendor/three.module.js"}}.
    # 'unsafe-inline' is kept only for style attributes set from CSSOM-adjacent markup.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-y0joblgLTLFGhbj/xXhGS1SyGmxly/oZpyENyx9LBXI='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

# ------------------------------------------------------- immutable artefacts
#
# Only /vendor is genuinely immutable: a pinned three.js build that is replaced by
# upgrading to a new file, never by editing this one.

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Everything under /assets is GENERATED and rewritten in place at a stable URL —
# the brand renders come out of js/brand/logo.js and the episode stills out of
# tools/shoot.mjs. These were `immutable` on the assumption that they never
# changed, which meant regenerating a thumbnail did not reach anyone who had
# already loaded the site: `immutable` tells a browser not to revalidate at all,
# so the old file would have been served from cache for up to a year. There is no
# content hash in these paths to make that safe, so they revalidate instead — the
# same treatment the JS and CSS already get, and a 304 costs a few hundred bytes.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    # og.png is the social preview, so it has to stay embeddable from other origins.
    Cross-Origin-Resource-Policy = "cross-origin"

# ------------------------------------------------------------ content types
#
# Modules must be served as JavaScript or the browser refuses to execute them.

[[headers]]
  for = "/js/*"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/vendor/three.module.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# The two pages are the only mutable entry points; always revalidate them.

[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
